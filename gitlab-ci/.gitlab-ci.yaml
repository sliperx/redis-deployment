# Telegram notification pipeline
stages:
  - stage_send

telegramm_job:
  stage: stage_send
  tags:
    - linux-ubuntu
  script:
    - echo "Ansible playbook have error"
    - echo "LOG_LINK=$LOG_LINK"
    - |    
      curl -s -X POST https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage \
        -d chat_id=$TELEGRAM_CHAT_ID \
        -d text="Ansible playbook failed. See logs: $LOG_LINK"


# ansible run pipeline

stages:
  - stage_run
  - stage_send

ansibleRun_job:
  stage: stage_run
  tags:
    - linux-ubuntu
  script:
    - echo "Hello world, that in my local gitlab-runner"
    - cat /etc/os-release
    - echo "LOG_LINK=${CI_JOB_URL}" > runLogs.env
    - ansible-playbook -i /etc/ansible/infra/inventory/stage.ini /etc/ansible/infra/stage.yml
  artifacts:
    reports:
      dotenv: runLogs.env
  when: always

trigger_telegram_job:
  stage: stage_send
  needs:
    - job: ansibleRun_job
      artifacts: true
  trigger:
    project: root/telegram-notification
    branch: main
    strategy: depend
    forward:
      pipeline_variables: true
  when: on_failure