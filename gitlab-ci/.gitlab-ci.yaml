stages:
- stage_run
- stage_send
- stage_status
#workflow:
#  rules:
#    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" 
#      when: always
#    - when: never
ansibleWork_job:
  stage: stage_run
  tags:
  - linux-ubuntu
  rules:
  - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
  script:
  - echo "Hello world, that in my local gitlab-runner"
  - cat /etc/os-release
  - |
    set +e
    ansible-playbook -i /etc/ansible/infra/inventory/stage.ini /etc/ansible/infra/stage.yml 
    STATUS=$?
    echo "STATUS=$STATUS" > status.env
    cat status.env
  artifacts:
    paths:
    - status.env
telegramm_job:
  stage: stage_send
  tags:
  - linux-ubuntu
  rules:
  - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
  dependencies:
  - ansibleWork_job
  script:
  - source status.env
  - cat status.env
  - |
    echo "Ansible exit code: $STATUS"
    if [ $STATUS -eq 0 ]; then
      echo "Ansible playbook work fine!"
    else
      echo "Ansible playbook have error! Exit code: $STATUS"
      curl -s -X POST https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage \
        -d chat_id=$TELEGRAM_CHAT_ID \
        -d text="Ansible playbook failed with exit code: $STATUS"
    fi
statusEnv_job:
  stage: stage_status
  tags:
  - linux-ubuntu
  dependencies:
  - ansibleWork_job
  script:
  - source status.env
  - echo "Ansible result is STATUS=$STATUS"
  - echo "Its bad"
  - echo "exit 1"
  - exit 1
